# ================================================================
# APPLICATION TEST PROPERTIES - Firebase Only (Bez SQL baze)
# ================================================================

# ============================================================
# 1?? FIREBASE EMULATOR KONFIGURACIJA
# ============================================================
firebase.firestore.emulator.host=localhost:8085
firebase.storage.emulator.host=localhost:8083
firebase.bucket.name=demo-project.appspot.com
firebase.project.id=demo-project

# Firebase Admin SDK - Disable u testovima
firebase.admin.enabled=false

# ============================================================
# 2?? SPRING BOOT KONFIGURACIJA
# ============================================================
spring.main.allow-bean-definition-overriding=true

# ============================================================
# 3?? SERVER KONFIGURACIJA
# ============================================================
server.port=0
# ?? Random port za testove (izbjegava konflikte)

server.error.include-message=always
server.error.include-binding-errors=always
# ?? Detaljne error poruke za debugging

# ============================================================
# 4?? MULTIPART FILE UPLOAD
# ============================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# ?? Iste postavke kao u produkciji

# ============================================================
# 5?? LOGGING KONFIGURACIJA
# ============================================================
logging.level.root=INFO
logging.level.hr.algebra.nrako=DEBUG
logging.level.com.google.cloud=WARN
logging.level.com.google.firebase=WARN
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# ============================================================
# 6?? SECURITY TEST KONFIGURACIJA
# ============================================================
spring.security.user.name=test
spring.security.user.password=test

# ============================================================
# 7?? ASYNC KONFIGURACIJA
# ============================================================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5

# ============================================================
# 8?? SELENIUM TEST KONFIGURACIJA
# ============================================================
selenium.frontend.url=http://localhost:3000
selenium.implicit.wait=10
selenium.explicit.wait=15

# ============================================================
# 9?? TEST FLAGS
# ============================================================
test.firebase.emulator.enabled=true
test.selenium.headless=false